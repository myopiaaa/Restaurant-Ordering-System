<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SALO-SALO | Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <main class="login-wrapper">
        <h1 class="login-title">SALO-SALO</h1>
        <p class="login-subtitle">Restaurant Ordering System</p>

        <div class="login-cards">

            <section class="login-card">
                <h2>Customer</h2>
                <p class="login-text">No account needed. Pick your food and place your order.</p>
                <button type="button" id="customerButton" class="login-button login-button-customer">Order</button>
            </section>

            <section class="login-card">
                <h2>Admin</h2>

                <form id="adminForm" autocomplete="off">
                    <label for="adminUsername">Username</label>
                    <input type="text" id="adminUsername" required>

                    <label for="adminPassword">Password</label>
                    <input type="password" id="adminPassword" required>

                    <p id="loginError" class="login-error" role="alert"></p>

                    <button type="submit" class="login-button">Login</button>
                </form>
            </section>

        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
</body>

</html>
